<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kallpa — Coach program</title>
  <script src="/config.js" onerror="void 0"></script>
  <script src="config.js" onerror="void 0"></script>
  <script>
    // Prefer live site config.js (KALLPA_CONFIG) when hosted on kallpa.co
    if (!window.COACH_INVITE_CONFIG && window.KALLPA_CONFIG) {
      window.COACH_INVITE_CONFIG = {
        SUPABASE_URL: window.KALLPA_CONFIG.SUPABASE_URL,
        SUPABASE_ANON_KEY: window.KALLPA_CONFIG.SUPABASE_ANON_KEY,
      };
    }
  </script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --border: #2a3542;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9a6a;
      --accent-dim: #2d7350;
      --danger: #c45c5c;
      --input: #121820;
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 1rem 1rem 4rem;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0; }
    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .lang-switch button {
      border: 0;
      border-radius: 0;
      padding: 0.35rem 0.65rem;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.8rem;
    }
    .lang-switch button.on {
      background: var(--accent-dim);
      color: #fff;
    }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 1rem; margin: 0 0 0.75rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0.6rem 0 0.25rem; }
    input, select, textarea {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.55rem 0.65rem;
      font: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 100px; }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      padding: 0.55rem 0.85rem;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent-dim);
      color: #fff;
      font-weight: 600;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.danger { color: #f0c0c0; border-color: var(--danger); }
    button.ghost { background: transparent; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .actions-stack { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
    .actions-stack .actions { margin-top: 0; }
    .actions-stack > .actions:not(.actions-build) {
      flex-wrap: nowrap;
      gap: 0.4rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.15rem;
    }
    .actions-stack > .actions:not(.actions-build) button {
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 0.45rem 0.7rem;
      font-size: 0.875rem;
    }
    .actions-build {
      padding-bottom: 0.75rem;
      border-bottom: 1px dashed var(--border);
    }
    button.add-day {
      border-style: dashed;
      border-color: var(--accent-dim);
      color: #b8e0c8;
      background: transparent;
    }
    button.add-day:hover { background: #15251c; }
    .day-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .ex {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      margin-top: 0.75rem;
    }
    .ex-title { font-weight: 600; font-size: 0.95rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .err {
      background: #2a1818;
      border: 1px solid var(--danger);
      color: #f0c0c0;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
    }
    .ok {
      background: #15251c;
      border: 1px solid var(--accent-dim);
      color: #b8e0c8;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
    }
    #action_feedback {
      margin-top: 0.75rem;
      min-height: 0;
    }
    #action_feedback:empty { display: none; }
    #action_feedback .ok,
    #action_feedback .err {
      margin-bottom: 0;
    }
    .search-results {
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 180px;
      overflow: auto;
      margin-top: 0.35rem;
      display: none;
    }
    .search-results button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: var(--input);
    }
    .search-results button:hover { background: #1c2630; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      background: #243040;
      color: var(--muted);
      margin-left: 0.35rem;
    }
    .hidden { display: none !important; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
    .chip {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .chip.on { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
    @media print {
      :root { --bg: #fff; --card: #fff; --border: #ccc; --text: #111; --muted: #444; --input: #fff; }
      body { background: #fff; color: #111; padding: 0; }
      .no-print, .search-results, button, .chip-row, [data-search], .badge, .lang-switch { display: none !important; }
      .card { border: 1px solid #ccc; break-inside: avoid; box-shadow: none; }
      input, select, textarea {
        border: none !important;
        background: transparent !important;
        color: #111 !important;
        padding: 0.15rem 0 !important;
      }
      textarea { min-height: 0; }
      a { color: #111; }
      .print-only { display: block !important; }
    }
    .print-only { display: none; }
  </style>
</head>

  function detectLang() {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'es' || q === 'en') return q;
    try {
      const saved = localStorage.getItem('kallpa_coach_invite_lang');
      if (saved === 'es' || saved === 'en') return saved;
    } catch (_) {}
    const nav = (navigator.language || '').toLowerCase();
    return nav.startsWith('es') ? 'es' : 'en';
  }

  let lang = detectLang();

  function t(key, vars) {
    const dict = I18N[lang] || I18N.en;
    let s = dict[key] ?? I18N.en[key] ?? key;
    if (vars) {
      Object.keys(vars).forEach((k) => {
        s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      });
    }
    return s;
  }

  function statusLabel(status) {
    return t('status_' + status) !== ('status_' + status) ? t('status_' + status) : status;
  }

  function setLang(next) {
    if (next !== 'en' && next !== 'es') return;
    lang = next;
    try { localStorage.setItem('kallpa_coach_invite_lang', lang); } catch (_) {}
    const url = new URL(location.href);
    url.searchParams.set('lang', lang);
    history.replaceState(null, '', url.toString());
    document.documentElement.lang = lang;
    applyChrome();
    if (!app.classList.contains('hidden')) render();
  }

  function applyChrome() {
    document.title = t('title');
    const titleEl = document.getElementById('page_title');
    const titlePrint = document.getElementById('page_title_print');
    if (titleEl) titleEl.textContent = t('title');
    if (titlePrint) titlePrint.textContent = t('title');
    document.getElementById('lang_en').classList.toggle('on', lang === 'en');
    document.getElementById('lang_es').classList.toggle('on', lang === 'es');
    if (state.status) {
      subtitle.textContent = t('programFor', {
        athlete: state.athlete || t('yourAthlete'),
        status: statusLabel(state.status),
      });
    } else if (!state.token) {
      subtitle.textContent = t('missingToken');
    }
  }

  function tokenFromUrl() {
    const q = new URLSearchParams(location.search).get('token');
    if (q) return q.trim();
    const parts = location.pathname.split('/').filter(Boolean);
    const inviteIdx = parts.lastIndexOf('invite');
    if (inviteIdx >= 0 && parts[inviteIdx + 1] && parts[inviteIdx + 1] !== 'index.html') {
      return parts[inviteIdx + 1].trim();
    }
    return '';
  }

  const state = {
    token: tokenFromUrl(),
    editable: false,
    status: '',
    athlete: '',
    coach_label: '',
    program_name: '',
    goal: 'hypertrophy',
    program_notes: '',
    howto_instructions: '',
    days: [],
  };

  const banner = document.getElementById('banner');
  const app = document.getElementById('app');
  const subtitle = document.getElementById('subtitle');
  const actionFeedback = document.getElementById('action_feedback');

  document.getElementById('lang_en').onclick = () => setLang('en');
  document.getElementById('lang_es').onclick = () => setLang('es');

  function showErr(msg) {
    banner.innerHTML = `<div class="err">${escapeHtml(msg)}</div>`;
  }
  function showOk(msg) {
    banner.innerHTML = `<div class="ok">${escapeHtml(msg)}</div>`;
  }
  function showActionOk(msg) {
    actionFeedback.innerHTML = `<div class="ok">${escapeHtml(msg)}</div>`;
    actionFeedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function showActionErr(msg) {
    actionFeedback.innerHTML = `<div class="err">${escapeHtml(msg)}</div>`;
    actionFeedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function clearActionFeedback() {
    actionFeedback.innerHTML = '';
  }
  function localizeActionError(msg) {
    if (!msg) return '';
    const m = String(msg);
    if (/already submitted/i.test(m)) return t('alreadySubmitted');
    if (/program name/i.test(m) || /nombre del programa/i.test(m)) return t('programNameRequired');
    if (/Invite not available|not available/i.test(m)) return t('inviteUnavailable');
    if (/Feature disabled|disabled/i.test(m)) return t('inviteUnavailable');
    return m;
  }
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function fn(path, opts = {}) {
    if (!ANON) throw new Error('Missing SUPABASE_ANON_KEY — copy config.example.js to config.js');
    const headers = {
      apikey: ANON,
      'Content-Type': 'application/json',
      'Accept-Language': lang === 'es' ? 'es' : 'en',
      ...(opts.headers || {}),
    };
    const r = await fetch(`${SUPABASE_URL}/functions/v1/${path}`, {
      ...opts,
      headers,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const detail = data.detail ? ` (${data.detail})` : '';
      const err = new Error((data.error || data.message || `HTTP ${r.status}`) + detail);
      err.status = r.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  function emptyDay(n) {
    return { day_number: n, label: t('dayN', { n }), notes: '', exercises: [] };
  }

  function emptyCustom() {
    return {
      exercise_id: null,
      custom: {
        name_en: '',
        name_es: '',
        equipment: 'dumbbell',
        muscles_primary: [],
      },
      exercise_name: '',
      sets: 3,
      reps_target: '8-12',
      rir_target: 2,
      notes: '',
    };
  }

  async function boot() {
    applyChrome();
    if (!state.token || state.token.length < 32) {
      subtitle.textContent = t('missingToken');
      showErr(t('missingTokenHint'));
      return;
    }
    subtitle.textContent = t('loading');
    try {
      const data = await fn(`coach-invite-validate?token=${encodeURIComponent(state.token)}`);
      state.status = data.status;
      state.editable = !!data.editable;
      state.athlete = data.athlete_display || t('yourAthlete');
      state.coach_label = data.coach_label || '';
      const meta = data.program_meta || {};
      state.program_name = meta.name || '';
      state.goal = meta.goal || 'hypertrophy';
      state.program_notes = data.program_notes || (data.structure && data.structure.program_notes) || '';
      state.howto_instructions = data.howto_instructions || (data.structure && data.structure.howto_instructions) || '';
      const days = (data.structure && data.structure.days) || [];
      state.days = days.length ? JSON.parse(JSON.stringify(days)) : [emptyDay(1), emptyDay(2), emptyDay(3)];
      subtitle.textContent = t('programFor', {
        athlete: state.athlete,
        status: statusLabel(state.status),
      });
      if (!state.editable) {
        showOk(data.status === 'submitted' ? t('alreadySubmitted') : t('readOnly'));
      }
      render();
    } catch (e) {
      subtitle.textContent = t('inviteUnavailable');
      showErr(e.message || t('loadFailed'));
    }
  }

  function buildPayload(asDraft) {
    const days = state.days.map((d, i) => ({
      day_number: i + 1,
      label: d.label || t('dayN', { n: i + 1 }),
      notes: d.notes || null,
      exercises: (d.exercises || []).map((ex, j) => {
        if (ex.custom) {
          return {
            exercise_id: null,
            custom: {
              name_en: ex.custom.name_en,
              name_es: ex.custom.name_es || null,
              equipment: ex.custom.equipment || 'other',
              muscles_primary: ex.custom.muscles_primary || [],
            },
            exercise_name: ex.custom.name_en,
            set_order: j + 1,
            sets: Number(ex.sets) || 3,
            reps_target: ex.reps_target || '8-12',
            rir_target: Number(ex.rir_target) || 2,
            notes: ex.notes || null,
          };
        }
        return {
          exercise_id: ex.exercise_id,
          exercise_name: ex.exercise_name,
          name_i18n: ex.name_i18n || undefined,
          set_order: j + 1,
          sets: Number(ex.sets) || 3,
          reps_target: ex.reps_target || '8-12',
          rir_target: Number(ex.rir_target) || 2,
          notes: ex.notes || null,
        };
      }),
    }));
    return {
      token: state.token,
      draft: !!asDraft,
      coach_label: state.coach_label,
      program_name: state.program_name,
      goal: state.goal,
      program_notes: state.program_notes,
      howto_instructions: state.howto_instructions,
      structure: {
        program_notes: state.program_notes,
        howto_instructions: state.howto_instructions,
        days,
      },
    };
  }

  function csvEscape(v) {
    const s = v == null ? '' : String(v);
    if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
    return s;
  }

  function downloadCsv() {
    const rows = [
      [t('csvProgram'), state.program_name || ''],
      [t('csvCoach'), state.coach_label || ''],
      [t('csvAthlete'), state.athlete || ''],
      [t('csvGoal'), t('goal_' + state.goal) || state.goal || ''],
      [t('csvProgramNotes'), state.program_notes || ''],
      [t('csvHowto'), state.howto_instructions || ''],
      [],
      [
        t('csvDay'), t('csvDayLabel'), t('csvDayNotes'), t('csvOrder'),
        t('csvExercise'), t('csvType'), t('csvSets'), t('csvReps'), t('csvRir'), t('csvExNotes'),
      ],
    ];
    state.days.forEach((day, di) => {
      const dayNum = di + 1;
      const label = day.label || t('dayN', { n: dayNum });
      const dayNotes = day.notes || '';
      const exercises = day.exercises || [];
      if (!exercises.length) {
        rows.push([dayNum, label, dayNotes, '', '', '', '', '', '', '']);
        return;
      }
      exercises.forEach((ex, ei) => {
        const isCustom = !!ex.custom;
        const name = exerciseDisplayName(ex);
        rows.push([
          dayNum,
          label,
          dayNotes,
          ei + 1,
          name,
          isCustom ? t('custom') : t('library'),
          ex.sets ?? 3,
          ex.reps_target || '',
          ex.rir_target ?? '',
          ex.notes || '',
        ]);
      });
    });
    const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    const safeName = (state.program_name || 'kallpa-program')
      .replace(/[^\w\-]+/g, '_')
      .slice(0, 60);
    a.href = URL.createObjectURL(blob);
    a.download = `${safeName}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    showActionOk(t('csvDone'));
  }

  function printProgram() {
    window.print();
  }

  async function save(asDraft) {
    banner.innerHTML = '';
    clearActionFeedback();
    try {
      const res = await fn('coach-invite-submit', {
        method: 'POST',
        body: JSON.stringify(buildPayload(asDraft)),
      });
      state.status = res.status;
      state.editable = res.status === 'draft' || res.status === 'pending';
      if (res.status === 'submitted') state.editable = false;
      subtitle.textContent = t('programFor', {
        athlete: state.athlete,
        status: statusLabel(state.status),
      });
      render();
      const okMsg = (asDraft || res.status === 'draft')
        ? t('draftSaved')
        : t('submittedOk');
      showActionOk(okMsg);
    } catch (e) {
      showActionErr(localizeActionError(e.message) || t('saveFailed'));
    }
  }

  function normalizeNameI18n(raw) {
    let value = raw;
    if (typeof value === 'string') {
      try { value = JSON.parse(value); } catch { return {}; }
    }
    if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
    const out = {};
    Object.keys(value).forEach((k) => {
      const v = value[k];
      if (typeof v === 'string' && v.trim()) out[k] = v.trim();
    });
    return out;
  }

  function exerciseDisplayName(ex) {
    if (ex.custom) {
      if (lang === 'es') {
        return (ex.custom.name_es || ex.custom.name_en || t('customExercise'));
      }
      return (ex.custom.name_en || ex.custom.name_es || t('customExercise'));
    }
    const i18n = normalizeNameI18n(ex.name_i18n);
    if (lang === 'es') {
      return (i18n.es || i18n.en || ex.exercise_name || t('exercise'));
    }
    return (i18n.en || i18n.es || ex.exercise_name || t('exercise'));
  }

  let searchTimer = null;
  async function searchExercises(q, dayIdx, resultEl) {
    if (!q || q.length < 2) {
      resultEl.style.display = 'none';
      resultEl.innerHTML = '';
      return;
    }
    resultEl.style.display = 'block';
    resultEl.innerHTML = `<button type="button" disabled>${escapeHtml(t('searching'))}</button>`;
    try {
      const data = await fn(
        `coach-invite-exercises?token=${encodeURIComponent(state.token)}&q=${encodeURIComponent(q)}&lang=${encodeURIComponent(lang)}`,
      );
      const list = data.exercises || [];
      if (!list.length) {
        resultEl.innerHTML = `<button type="button" disabled>${escapeHtml(t('noMatches'))}</button>`;
        return;
      }
      resultEl.innerHTML = list.map((ex) => {
        const i18n = normalizeNameI18n(ex.name_i18n);
        const nameEn = i18n.en || '';
        const nameEs = i18n.es || '';
        const label = lang === 'es'
          ? (nameEs || nameEn || ex.name || t('exercise'))
          : (nameEn || nameEs || ex.name || t('exercise'));
        return `<button type="button" data-id="${escapeHtml(ex.id)}" data-name-en="${escapeHtml(nameEn)}" data-name-es="${escapeHtml(nameEs)}">${escapeHtml(label)} <span class="muted">${escapeHtml((ex.muscles_primary || []).slice(0, 2).map((m) => t('m_' + m) || m).join(', '))}</span></button>`;
      }).join('');
      resultEl.querySelectorAll('button[data-id]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const nameEn = btn.dataset.nameEn || '';
          const nameEs = btn.dataset.nameEs || '';
          state.days[dayIdx].exercises.push({
            exercise_id: btn.dataset.id,
            // Canonical EN snapshot for athlete accept / program rows
            exercise_name: nameEn || nameEs,
            name_i18n: {
              ...(nameEn ? { en: nameEn } : {}),
              ...(nameEs ? { es: nameEs } : {}),
            },
            sets: 3,
            reps_target: '8-12',
            rir_target: 2,
            notes: '',
          });
          resultEl.style.display = 'none';
          render();
        });
      });
    } catch (e) {
      resultEl.innerHTML = `<button type="button" disabled>${escapeHtml(e.message || t('searchFailed'))}</button>`;
      console.error('[coach-invite search]', e);
    }
  }

  function render() {
    app.classList.remove('hidden');
    const disabled = state.editable ? '' : 'disabled';
    const ro = state.editable ? '' : 'readonly';
    applyChrome();

    app.innerHTML = `
      <div class="card">
        <h2>${escapeHtml(t('programDetails'))}</h2>
        <label>${escapeHtml(t('coachName'))}</label>
        <input id="coach_label" ${ro} value="${escapeHtml(state.coach_label)}" placeholder="${escapeHtml(t('coachNamePh'))}" />
        <label>${escapeHtml(t('programName'))}</label>
        <input id="program_name" ${ro} value="${escapeHtml(state.program_name)}" placeholder="${escapeHtml(t('programNamePh'))}" />
        <label>${escapeHtml(t('goal'))}</label>
        <select id="goal" ${disabled}>
          ${GOALS.map((g) => `<option value="${g}" ${state.goal === g ? 'selected' : ''}>${escapeHtml(t('goal_' + g))}</option>`).join('')}
        </select>
        <label>${escapeHtml(t('programNotes'))}</label>
        <textarea id="program_notes" ${ro} placeholder="${escapeHtml(t('programNotesPh'))}">${escapeHtml(state.program_notes)}</textarea>
        <label>${escapeHtml(t('howto'))}</label>
        <textarea id="howto_instructions" ${ro} placeholder="${escapeHtml(t('howtoPh'))}">${escapeHtml(state.howto_instructions)}</textarea>
      </div>
      <div id="days"></div>
      <div class="actions-stack no-print">
        ${state.editable ? `
          <div class="actions actions-build">
            <button type="button" class="add-day" id="add_day">${escapeHtml(t('addDay'))}</button>
          </div>
        ` : ''}
        <div class="actions">
          ${state.editable ? `
            <button type="button" id="save_draft">${escapeHtml(t('saveDraft'))}</button>
            <button type="button" class="primary" id="submit_btn">${escapeHtml(t('submit'))}</button>
          ` : ''}
          <button type="button" id="print_btn">${escapeHtml(t('print'))}</button>
          <button type="button" id="csv_btn">${escapeHtml(t('csv'))}</button>
        </div>
      </div>
    `;

    const daysEl = app.querySelector('#days');
    state.days.forEach((day, di) => {
      const dayCard = document.createElement('div');
      dayCard.className = 'card';
      dayCard.innerHTML = `
        <div class="day-head">
          <h2>${escapeHtml(t('dayN', { n: di + 1 }))}</h2>
          ${state.editable ? `<button type="button" class="danger ghost" data-rm-day="${di}">${escapeHtml(t('removeDay'))}</button>` : ''}
        </div>
        <label>${escapeHtml(t('label'))}</label>
        <input data-day-label="${di}" ${ro} value="${escapeHtml(day.label || '')}" />
        <label>${escapeHtml(t('dayNotes'))}</label>
        <textarea data-day-notes="${di}" ${ro}>${escapeHtml(day.notes || '')}</textarea>
        <div data-ex-list="${di}"></div>
        ${state.editable ? `
          <div class="no-print">
            <label>${escapeHtml(t('addFromLibrary'))}</label>
            <input data-search="${di}" placeholder="${escapeHtml(t('searchPh'))}" />
            <div class="search-results" data-search-results="${di}"></div>
            <div class="actions">
              <button type="button" data-add-custom="${di}">${escapeHtml(t('addCustom'))}</button>
            </div>
          </div>
        ` : ''}
      `;
      daysEl.appendChild(dayCard);

      const list = dayCard.querySelector(`[data-ex-list="${di}"]`);
      (day.exercises || []).forEach((ex, ei) => {
        const block = document.createElement('div');
        block.className = 'ex';
        const isCustom = !!ex.custom;
        const title = exerciseDisplayName(ex);
        block.innerHTML = `
          <div class="ex-title">${escapeHtml(title)}
            <span class="badge">${escapeHtml(isCustom ? t('custom') : t('library'))}</span>
            ${state.editable ? `<button type="button" class="danger ghost" data-rm-ex="${di}:${ei}" style="float:right">${escapeHtml(t('remove'))}</button>` : ''}
          </div>
          ${isCustom && state.editable ? `
            <label>${escapeHtml(t('nameEn'))}</label>
            <input data-c-name="${di}:${ei}" value="${escapeHtml(ex.custom.name_en || '')}" />
            <label>${escapeHtml(t('nameEs'))}</label>
            <input data-c-name-es="${di}:${ei}" value="${escapeHtml(ex.custom.name_es || '')}" />
            <label>${escapeHtml(t('equipment'))}</label>
            <select data-c-eq="${di}:${ei}">
              ${EQUIPMENT.map((e) => `<option value="${e}" ${ex.custom.equipment === e ? 'selected' : ''}>${escapeHtml(t('eq_' + e))}</option>`).join('')}
            </select>
            <label>${escapeHtml(t('primaryMuscles'))}</label>
            <div class="chip-row" data-c-mus="${di}:${ei}">
              ${MUSCLES.map((m) => {
                const on = (ex.custom.muscles_primary || []).includes(m);
                return `<span class="chip ${on ? 'on' : ''}" data-m="${m}">${escapeHtml(t('m_' + m))}</span>`;
              }).join('')}
            </div>
          ` : ''}
          <div class="row">
            <div><label>${escapeHtml(t('sets'))}</label><input type="number" min="1" max="20" data-sets="${di}:${ei}" ${ro} value="${ex.sets ?? 3}" /></div>
            <div><label>${escapeHtml(t('reps'))}</label><input data-reps="${di}:${ei}" ${ro} value="${escapeHtml(ex.reps_target || '8-12')}" /></div>
            <div><label>${escapeHtml(t('rir'))}</label><input type="number" min="0" max="5" data-rir="${di}:${ei}" ${ro} value="${ex.rir_target ?? 2}" /></div>
          </div>
          <label>${escapeHtml(t('exNotes'))}</label>
          <textarea data-ex-notes="${di}:${ei}" ${ro} placeholder="${escapeHtml(t('exNotesPh'))}">${escapeHtml(ex.notes || '')}</textarea>
        `;
        list.appendChild(block);
      });
    });

    const bind = (sel, fnBind) => {
      app.querySelectorAll(sel).forEach((el) => {
        el.addEventListener('input', fnBind);
        el.addEventListener('change', fnBind);
      });
    };
    const g = (id) => app.querySelector(id);
    if (g('#coach_label')) g('#coach_label').oninput = (e) => { state.coach_label = e.target.value; };
    if (g('#program_name')) g('#program_name').oninput = (e) => { state.program_name = e.target.value; };
    if (g('#goal')) g('#goal').onchange = (e) => { state.goal = e.target.value; };
    if (g('#program_notes')) g('#program_notes').oninput = (e) => { state.program_notes = e.target.value; };
    if (g('#howto_instructions')) g('#howto_instructions').oninput = (e) => { state.howto_instructions = e.target.value; };

    bind('[data-day-label]', (e) => {
      state.days[+e.target.dataset.dayLabel].label = e.target.value;
    });
    bind('[data-day-notes]', (e) => {
      state.days[+e.target.dataset.dayNotes].notes = e.target.value;
    });

    const parseIdx = (v) => v.split(':').map(Number);
    bind('[data-sets]', (e) => {
      const [d, i] = parseIdx(e.target.dataset.sets);
      state.days[d].exercises[i].sets = +e.target.value;
    });
    bind('[data-reps]', (e) => {
      const [d, i] = parseIdx(e.target.dataset.reps);
      state.days[d].exercises[i].reps_target = e.target.value;
    });
    bind('[data-rir]', (e) => {
      const [d, i] = parseIdx(e.target.dataset.rir);
      state.days[d].exercises[i].rir_target = +e.target.value;
    });
    bind('[data-ex-notes]', (e) => {
      const [d, i] = parseIdx(e.target.dataset.exNotes);
      state.days[d].exercises[i].notes = e.target.value;
    });
    bind('[data-c-name]', (e) => {
      const [d, i] = parseIdx(e.target.dataset.cName);
      state.days[d].exercises[i].custom.name_en = e.target.value;
      state.days[d].exercises[i].exercise_name = e.target.value;
    });
    bind('[data-c-name-es]', (e) => {
      const [d, i] = parseIdx(e.target.dataset.cNameEs);
      state.days[d].exercises[i].custom.name_es = e.target.value;
    });
    bind('[data-c-eq]', (e) => {
      const [d, i] = parseIdx(e.target.dataset.cEq);
      state.days[d].exercises[i].custom.equipment = e.target.value;
    });

    app.querySelectorAll('[data-c-mus]').forEach((row) => {
      const [d, i] = parseIdx(row.dataset.cMus);
      row.querySelectorAll('.chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          if (!state.editable) return;
          const m = chip.dataset.m;
          const arr = state.days[d].exercises[i].custom.muscles_primary || [];
          const idx = arr.indexOf(m);
          if (idx >= 0) arr.splice(idx, 1);
          else arr.push(m);
          state.days[d].exercises[i].custom.muscles_primary = arr;
          render();
        });
      });
    });

    app.querySelectorAll('[data-rm-day]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const di = +btn.dataset.rmDay;
        if (state.days.length <= 1) return;
        state.days.splice(di, 1);
        render();
      });
    });
    app.querySelectorAll('[data-rm-ex]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const [d, i] = parseIdx(btn.dataset.rmEx);
        state.days[d].exercises.splice(i, 1);
        render();
      });
    });
    app.querySelectorAll('[data-add-custom]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.days[+btn.dataset.addCustom].exercises.push(emptyCustom());
        render();
      });
    });
    app.querySelectorAll('[data-search]').forEach((input) => {
      const di = +input.dataset.search;
      const results = app.querySelector(`[data-search-results="${di}"]`);
      input.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => searchExercises(input.value.trim(), di, results), 250);
      });
    });

    const addDay = app.querySelector('#add_day');
    if (addDay) addDay.onclick = () => {
      state.days.push(emptyDay(state.days.length + 1));
      render();
    };
    const saveDraft = app.querySelector('#save_draft');
    if (saveDraft) saveDraft.onclick = () => save(true);
    const submitBtn = app.querySelector('#submit_btn');
    if (submitBtn) submitBtn.onclick = () => {
      if (!state.program_name.trim()) {
        showActionErr(t('programNameRequired'));
        return;
      }
      if (!confirm(t('submitConfirm'))) return;
      save(false);
    };
    const printBtn = app.querySelector('#print_btn');
    if (printBtn) printBtn.onclick = () => printProgram();
    const csvBtn = app.querySelector('#csv_btn');
    if (csvBtn) csvBtn.onclick = () => downloadCsv();
  }

  boot();
})();
  </script>
</body>
</html>
