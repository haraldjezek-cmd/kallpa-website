<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        if (location.protocol === 'http:' &&
            /(^|\.)kallpa\.co$/i.test(location.hostname)) {
          location.replace(
            'https://' + location.host + location.pathname +
            location.search + location.hash
          );
        }
      } catch (_) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kallpa — Session summary</title>
  <script src="/config.js" onerror="void 0"></script>
  <script src="config.js" onerror="void 0"></script>
  <style>
    :root {
      --text: #111; --muted: #555; --border: #ccc; --accent: #2d7350;
      --font: "Segoe UI", system-ui, sans-serif;
    }
    body { margin: 0; font-family: var(--font); color: var(--text); background: #fff; padding: 1.25rem; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .actions { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    button { font: inherit; padding: 0.5rem 0.9rem; border-radius: 8px; border: 1px solid var(--border); background: var(--accent); color: #fff; cursor: pointer; }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); margin-bottom: 1rem; }
    .ex { border-top: 1px solid var(--border); padding: 0.75rem 0; }
    .ex h2 { font-size: 1.05rem; margin: 0 0 0.35rem; }
    .set { margin-left: 0.5rem; font-size: 0.95rem; }
    .notes { white-space: pre-wrap; color: var(--muted); font-size: 0.95rem; margin: 0.75rem 0; }
    .err { color: #a33; }
    @media print {
      .actions { display: none; }
      body { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="actions">
      <button onclick="window.print()">Print / Save PDF</button>
    </div>
    <div id="root"><p class="sub">Loading…</p></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const cfg = window.KALLPA_CONFIG || window.COACH_ADMIN_CONFIG || {};
    const base = (cfg.SUPABASE_URL || '').replace(/\/$/, '');

    async function load() {
      const root = document.getElementById('root');
      if (!token || !base) {
        root.innerHTML = '<p class="err">Missing token or config.</p>';
        return;
      }
      const res = await fetch(`${base}/functions/v1/coach-admin-print?token=${encodeURIComponent(token)}`, {
        headers: { apikey: cfg.SUPABASE_ANON_KEY || '', Authorization: `Bearer ${cfg.SUPABASE_ANON_KEY || ''}` },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok || data.kind !== 'session') {
        root.innerHTML = `<p class="err">${data.error || 'Not found'}</p>`;
        return;
      }
      const p = data.payload || {};
      let html = `<h1>Session summary</h1>`;
      html += `<p class="sub">${escapeHtml(p.client_name || 'Client')}`;
      if (p.coach_name) html += ` · Coach ${escapeHtml(p.coach_name)}`;
      html += `</p>`;
      if (p.session_date) {
        html += `<p class="sub">${escapeHtml(String(p.session_date).replace('T', ' ').slice(0, 16))}</p>`;
      }
      if (p.session_notes) {
        html += `<div class="notes"><strong>Notes</strong><br/>${escapeHtml(p.session_notes)}</div>`;
      }
      (p.exercises || []).forEach(ex => {
        html += `<section class="ex"><h2>${escapeHtml(ex.name || 'Exercise')}</h2>`;
        if (ex.note) html += `<div class="notes">${escapeHtml(ex.note)}</div>`;
        (ex.sets || []).forEach(s => {
          const parts = [`#${s.set_number}`];
          if (s.weight_kg != null) parts.push(`${s.weight_kg} kg`);
          if (s.reps != null) parts.push(`${s.reps} reps`);
          if (s.rir != null) parts.push(`RIR ${s.rir}`);
          if (s.is_warmup) parts.push('warmup');
          html += `<div class="set">${escapeHtml(parts.join(' · '))}</div>`;
        });
        html += `</section>`;
      });
      root.innerHTML = html;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    load();
  </script>
</body>
</html>
